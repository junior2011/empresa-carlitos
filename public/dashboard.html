<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard de Rutas - Empresa Carlitos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: #f8f9fa; }
  #sidebar { width: 350px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid #e5e7eb; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
  .sidebar-header h1 { font-size: 20px; margin-bottom: 4px; }
  .sidebar-header p { font-size: 13px; opacity: 0.9; }
  .trips-list { flex: 1; overflow-y: auto; padding: 16px; }
  .trip-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
  .trip-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1); }
  .trip-card.active { border-color: #667eea; background: #eff6ff; }
  .trip-id { font-size: 12px; color: #6b7280; font-family: monospace; margin-bottom: 8px; }
  .trip-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .trip-stat { font-size: 12px; }
  .trip-stat-label { color: #6b7280; }
  .trip-stat-value { font-weight: 600; color: #1f2937; }
  .trip-status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-top: 8px; }
  .trip-status.moving { background: #dbeafe; color: #1e40af; }
  .trip-status.stopped { background: #fef3c7; color: #92400e; }
  .no-trips { text-align: center; padding: 40px 20px; color: #9ca3af; }
  #map { flex: 1; }
  .refresh-btn { padding: 12px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin: 16px; }
  .refresh-btn:hover { background: #5568d3; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1><i class="fas fa-map-marked-alt"></i> Dashboard de Rutas</h1>
    <p>Monitoreo en tiempo real</p>
  </div>
  <div class="trips-list" id="tripsList">
    <div class="no-trips">
      <i class="fas fa-satellite-dish" style="font-size: 48px; margin-bottom: 12px;"></i>
      <p>Esperando viajes activos...</p>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadTrips()">
    <i class="fas fa-sync-alt"></i> Actualizar
  </button>
</div>

<div id="map"></div>

<script>
const BACKEND_URL = window.location.origin;
let map, routeLine, userMarker;
let selectedTripId = null;
let pollInterval;

function initMap() {
  map = L.map('map').setView([19.4326, -99.1332], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
}

async function loadTrips() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/trips`);
    const trips = await res.json();
    
    const container = document.getElementById('tripsList');
    
    if (trips.length === 0) {
      container.innerHTML = '<div class="no-trips"><i class="fas fa-satellite-dish" style="font-size: 48px; margin-bottom: 12px;"></i><p>No hay viajes activos</p></div>';
      return;
    }

    container.innerHTML = trips.map(trip => {
      const lastUpdate = new Date(trip.stats.lastUpdate).toLocaleTimeString('es-ES');
      const distance = (trip.stats.distance / 1000).toFixed(2);
      const status = trip.lastPoint?.status || 'unknown';
      const statusText = status === 'moving' ? '🚗 En Movimiento' : '🛑 Detenido';
      
      return `
        <div class="trip-card ${trip.tripId === selectedTripId ? 'active' : ''}" onclick="selectTrip('${trip.tripId}')">
          <div class="trip-id">${trip.tripId}</div>
          <div class="trip-status ${status}">${statusText}</div>
          <div class="trip-stats">
            <div class="trip-stat">
              <div class="trip-stat-label">Distancia</div>
              <div class="trip-stat-value">${distance} km</div>
            </div>
            <div class="trip-stat">
              <div class="trip-stat-label">Última actualización</div>
              <div class="trip-stat-value">${lastUpdate}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Error cargando viajes:', err);
  }
}

async function selectTrip(tripId) {
  selectedTripId = tripId;
  loadTrips();
  
  if (pollInterval) clearInterval(pollInterval);
  
  await fetchTripData(tripId);
  pollInterval = setInterval(() => fetchTripData(tripId), 3000);
}

async function fetchTripData(tripId) {
  try {
    const res = await fetch(`${BACKEND_URL}/api/trip/${tripId}`);
    if (!res.ok) throw new Error('No encontrado');
    const data = await res.json();
    drawRoute(data.points);
  } catch (err) {
    console.error(err);
  }
}

function drawRoute(points) {
  if (!points || points.length === 0) return;

  const latlngs = points.map(p => [p.lat, p.lng]);

  if (routeLine) {
    routeLine.setLatLngs(latlngs);
  } else {
    routeLine = L.polyline(latlngs, { color: '#667eea', weight: 4 }).addTo(map);
  }

  const lastPoint = points[points.length - 1];
  if (userMarker) {
    userMarker.setLatLng([lastPoint.lat, lastPoint.lng]);
  } else {
    userMarker = L.marker([lastPoint.lat, lastPoint.lng]).addTo(map).bindPopup('Ubicación del móvil').openPopup();
  }

  map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
}

initMap();
loadTrips();
setInterval(loadTrips, 5000);
</script>
</body>
</html>
