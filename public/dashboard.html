<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard de Rutas - Empresa Carlitos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: #f8f9fa; }
  
  /* Sidebar */
  #sidebar { width: 400px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-header { padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
  .sidebar-header h1 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  
  /* Planificador */
  .planner-section { padding: 20px; border-bottom: 1px solid #e5e7eb; }
  .planner-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #1f2937; }
  .address-input { display: flex; gap: 8px; margin-bottom: 8px; }
  .address-input input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  .address-input button { background: #ef4444; color: white; border: none; border-radius: 8px; width: 36px; cursor: pointer; }
  .btn-plan { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-plan:disabled { background: #9ca3af; cursor: not-allowed; }
  
  /* Resultados de ruta */
  .route-result { margin-top: 16px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; display: none; }
  .route-result h3 { font-size: 14px; color: #166534; margin-bottom: 8px; }
  .route-stat { font-size: 13px; color: #15803d; margin-bottom: 4px; }
  .optimized-list { list-style: none; margin-top: 12px; }
  .optimized-list li { padding: 6px 0; font-size: 13px; color: #374151; border-bottom: 1px dashed #d1d5db; display: flex; gap: 8px; }
  .optimized-list li:last-child { border-bottom: none; }
  .step-num { background: #667eea; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }

  /* Lista de viajes en vivo */
  .live-section { padding: 20px; flex: 1; }
  .live-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #1f2937; display: flex; align-items: center; gap: 8px; }
  .trip-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
  .trip-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1); }
  .trip-card.active { border-color: #667eea; background: #eff6ff; }
  .trip-id { font-size: 12px; color: #6b7280; font-family: monospace; margin-bottom: 8px; }
  .trip-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .trip-stat-label { font-size: 11px; color: #6b7280; }
  .trip-stat-value { font-size: 14px; font-weight: 600; color: #1f2937; }
  .trip-status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-top: 8px; }
  .trip-status.moving { background: #dbeafe; color: #1e40af; }
  .trip-status.stopped { background: #fef3c7; color: #92400e; }
  
  /* Mapa */
  #map { flex: 1; }
  
  /* Loading */
  .loading { text-align: center; padding: 10px; color: #6b7280; font-size: 13px; display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1><i class="fas fa-map-marked-alt"></i> Empresa Carlitos</h1>
    <p>Planificador de Rutas y Monitoreo</p>
  </div>

  <!-- SECCIÓN 1: PLANIFICADOR DE RUTAS -->
  <div class="planner-section">
    <div class="planner-title"><i class="fas fa-route"></i> Planificar Ruta Óptima</div>
    <div id="addressInputs">
      <div class="address-input">
        <input type="text" placeholder="Ej: Av. Reforma 500, CDMX" class="addr-field">
        <button onclick="removeAddress(this)" title="Eliminar">×</button>
      </div>
      <div class="address-input">
        <input type="text" placeholder="Ej: Zócalo, CDMX" class="addr-field">
        <button onclick="removeAddress(this)" title="Eliminar">×</button>
      </div>
    </div>
    <button class="btn-plan" style="background:#3b82f6; margin-bottom:8px;" onclick="addAddress()">+ Agregar dirección</button>
    <button class="btn-plan" id="btnCalculate" onclick="calculateOptimalRoute()">
      <i class="fas fa-calculator"></i> Calcular Ruta Óptima (Tráfico)
    </button>
    
    <div class="loading" id="routeLoading">
      <div class="spinner"></div> Geocodificando y calculando ruta...
    </div>

    <div class="route-result" id="routeResult">
      <h3>✅ Ruta Optimizada</h3>
      <div class="route-stat"><i class="fas fa-road"></i> <span id="resDistance">0</span> km</div>
      <div class="route-stat"><i class="fas fa-clock"></i> <span id="resTime">0</span> min</div>
      <ul class="optimized-list" id="resList"></ul>
    </div>
  </div>

  <!-- SECCIÓN 2: RASTREO EN VIVO -->
  <div class="live-section">
    <div class="live-title"><i class="fas fa-satellite-dish"></i> Monitoreo en Vivo</div>
    <div id="tripsList">
      <div style="text-align: center; padding: 20px; color: #9ca3af; font-size: 14px;">
        Esperando dispositivos móviles...
      </div>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
const BACKEND_URL = window.location.origin;
let map, routeLine, userMarker;
let selectedTripId = null;
let pollInterval;

// Inicializar mapa
function initMap() {
  map = L.map('map').setView([19.4326, -99.1332], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
}

// --- LÓGICA DEL PLANIFICADOR DE RUTAS ---
function addAddress() {
  const container = document.getElementById('addressInputs');
  const div = document.createElement('div');
  div.className = 'address-input';
  div.innerHTML = `
    <input type="text" placeholder="Nueva dirección..." class="addr-field">
    <button onclick="removeAddress(this)" title="Eliminar">×</button>
  `;
  container.appendChild(div);
}

function removeAddress(btn) {
  const inputs = document.querySelectorAll('.addr-field');
  if (inputs.length > 2) {
    btn.parentElement.remove();
  } else {
    alert('Se necesitan al menos 2 direcciones.');
  }
}

async function calculateOptimalRoute() {
  const inputs = [...document.querySelectorAll('.addr-field')].map(i => i.value.trim()).filter(Boolean);
  if (inputs.length < 2) { alert('Ingresa al menos 2 direcciones.'); return; }

  const btn = document.getElementById('btnCalculate');
  const loading = document.getElementById('routeLoading');
  const resultDiv = document.getElementById('routeResult');
  
  btn.disabled = true;
  loading.style.display = 'block';
  resultDiv.style.display = 'none';

  try {
    // 1. Geocodificar direcciones
    const coords = [];
    for (const addr of inputs) {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`);
      const data = await res.json();
      if (!data.length) throw new Error(`No se encontró: "${addr}"`);
      coords.push({ lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: addr });
    }

    // 2. Llamar a OSRM Trip (TSP - Optimización de ruta)
    const coordsStr = coords.map(c => `${c.lon},${c.lat}`).join(';');
    const osrmUrl = `https://router.project-osrm.org/trip/v1/driving/${coordsStr}?overview=full&geometries=geojson&source=first&destination=last&roundtrip=false`;
    
    const osrmRes = await fetch(osrmUrl);
    const osrmData = await osrmRes.json();
    
    if (osrmData.code !== 'Ok') throw new Error('Error al calcular la ruta en OSRM');

    const trip = osrmData.trips[0];
    const waypoints = osrmData.waypoints;

    // 3. Dibujar en mapa
    if (routeLine) map.removeLayer(routeLine);
    const latlngs = trip.geometry.coordinates.map(c => [c[1], c[0]]);
    routeLine = L.polyline(latlngs, { color: '#10b981', weight: 5, opacity: 0.8 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

    // Marcadores numerados
    waypoints.forEach((wp, i) => {
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:#ef4444;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid white;box-shadow:0 2px 4px rgba(0,0,0,.3)">${i+1}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
      L.marker([wp.location[1], wp.location[0]], { icon }).addTo(map)
       .bindPopup(`<b>Parada ${i+1}</b><br>${coords[wp.waypoint_index].name}`);
    });

    // 4. Mostrar resultados
    document.getElementById('resDistance').textContent = (trip.distance / 1000).toFixed(2);
    document.getElementById('resTime').textContent = Math.round(trip.duration / 60);
    
    const list = document.getElementById('resList');
    list.innerHTML = '';
    waypoints.forEach((wp, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="step-num">${i+1}</span> ${coords[wp.waypoint_index].name}`;
      list.appendChild(li);
    });

    resultDiv.style.display = 'block';

  } catch (err) {
    alert('Error: ' + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

// --- LÓGICA DE RASTREO EN VIVO ---
async function loadTrips() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/trips`);
    const trips = await res.json();
    const container = document.getElementById('tripsList');
    
    if (trips.length === 0) {
      container.innerHTML = '<div style="text-align: center; padding: 20px; color: #9ca3af; font-size: 14px;">Esperando dispositivos móviles...</div>';
      return;
    }

    container.innerHTML = trips.map(trip => {
      const lastUpdate = new Date(trip.stats.lastUpdate).toLocaleTimeString('es-ES');
      const distance = (trip.stats.distance / 1000).toFixed(2);
      const status = trip.lastPoint?.status || 'unknown';
      const statusText = status === 'moving' ? '🚗 En Movimiento' : '🛑 Detenido';
      
      return `
        <div class="trip-card ${trip.tripId === selectedTripId ? 'active' : ''}" onclick="selectTrip('${trip.tripId}')">
          <div class="trip-id">ID: ${trip.tripId}</div>
          <div class="trip-status ${status}">${statusText}</div>
          <div class="trip-stats">
            <div class="trip-stat">
              <div class="trip-stat-label">Distancia</div>
              <div class="trip-stat-value">${distance} km</div>
            </div>
            <div class="trip-stat">
              <div class="trip-stat-label">Última vez</div>
              <div class="trip-stat-value">${lastUpdate}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) { console.error('Error cargando viajes:', err); }
}

async function selectTrip(tripId) {
  selectedTripId = tripId;
  loadTrips();
  if (pollInterval) clearInterval(pollInterval);
  await fetchTripData(tripId);
  pollInterval = setInterval(() => fetchTripData(tripId), 3000);
}

async function fetchTripData(tripId) {
  try {
    const res = await fetch(`${BACKEND_URL}/api/trip/${tripId}`);
    if (!res.ok) throw new Error('No encontrado');
    const data = await res.json();
    drawRoute(data.points);
  } catch (err) { console.error(err); }
}

function drawRoute(points) {
  if (!points || points.length === 0) return;
  const latlngs = points.map(p => [p.lat, p.lng]);

  if (routeLine) routeLine.setLatLngs(latlngs);
  else routeLine = L.polyline(latlngs, { color: '#667eea', weight: 4, dashArray: '5, 10' }).addTo(map);

  const lastPoint = points[points.length - 1];
  if (userMarker) userMarker.setLatLng([lastPoint.lat, lastPoint.lng]);
  else userMarker = L.marker([lastPoint.lat, lastPoint.lng]).addTo(map).bindPopup('Móvil en vivo').openPopup();

  map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
}

// Inicialización
initMap();
loadTrips();
setInterval(loadTrips, 5000);
</script>
</body>
</html>
